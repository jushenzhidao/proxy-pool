# 镜像引用：本地构建（默认）或直接用 ghcr.io 预构建镜像
#   本地构建：  docker compose up -d --build
#   拉预构建：  IMAGE_TAG=v1.0.0 docker compose pull && docker compose up -d
#   可覆盖：    IMAGE_REPO / IMAGE_TAG
x-proxy-defaults: &proxy-defaults
  image: ${IMAGE_REPO:-ghcr.io/jushenzhidao/proxy-pool}:${IMAGE_TAG:-latest}
  build: .
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  proxy-01:
    <<: *proxy-defaults
    container_name: proxy-01
    environment:
      BIND_IP: ${IP_1:?IP_1 is not set - run generate-env.sh first}
      PORT: 1080

  proxy-02:
    <<: *proxy-defaults
